<!DOCTYPE html>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #fff8ed; color: #292724;
      font-family: system-ui, sans-serif; line-height: 1.8;
    }
    header, main, footer {
      max-width: 880px; margin: auto; padding: 24px;
    }
    header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 20px; flex-wrap: wrap;
    }
    nav { display: flex; gap: 24px; }
    a { color: #77523c; text-underline-offset: 5px; }
    nav a { text-decoration: none; }
    nav a[aria-current] { border-bottom: 2px solid; }

/* 圆形头像 */
.intro .avatar {
  display: block;
  width: 104px;
  height: 104px;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 3px solid #fff;
  box-shadow: 0 4px 14px rgba(70, 50, 30, 0.12);
  margin-bottom: 20px;
}

/* 手机上的头像稍小 */
@media (max-width: 600px) {
  .intro .avatar {
    width: 88px;
    height: 88px;
  }
} 

    /* 阿 狸 */
    /* 顶部介绍：左边文字，右边插画 */
.intro {
  display: block;
  position: relative;
  padding: 40px 46% 40px 24px;
  min-height: 340px;
  border-radius: 16px;

  background-color: #fff8ed;
  background-image: url("fox-magic.jpeg");
  background-position: right center;
  background-size: 58% auto;
  background-repeat: no-repeat;
}

/* 手机：文字在上，插画在下 */
@media (max-width: 600px) {
  .intro {
    padding: 24px;
    min-height: 0;
    background-image: none;
  }

  .intro::after {
    content: "";
    display: block;
    width: 100%;
    aspect-ratio: 1184 / 665;
    margin-top: 20px;
    background: url("fox-magic.jpeg") center / contain no-repeat;
  }
}
    h1 { font-size: 40px; line-height: 1.3; }
    section { margin-bottom: 48px; }
    .card {
      padding: 24px; margin: 16px 0;
      background: white; border-radius: 12px;
    }
    footer { font-size: 14px; color: #69645f; }
    @media (max-width: 600px) {
      .intro { flex-direction: column-reverse; align-items: flex-start; }
      h1 { font-size: 32px; }
    }

/* 飘雪层 */
#snowfall {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 100;
}

.falling-snow {
  position: absolute;
  top: -40px;
  color: #729bb5;
  font-family: sans-serif;
  line-height: 1;
  user-select: none;
  animation: snow-fall linear infinite;
}

@keyframes snow-fall {
  from {
    transform: translate3d(0, -40px, 0) rotate(0deg);
  }
  to {
    transform: translate3d(var(--drift), calc(100vh + 80px), 0)
               rotate(240deg);
  }
}

/* 尊重系统的“减少动态效果”设置 */
@media (prefers-reduced-motion: reduce) {
  #snowfall {
    display: none;
  }

  .falling-snow {
    animation: none;
  }
}
    /* 书法风格标题 */
.art-title {
  font-family: "Xingkai SC", "STXingkai", "Kaiti SC", "KaiTi", cursive;
  font-size: 42px;
  font-weight: normal;
  letter-spacing: 3px;
  line-height: 1.5;
  color: #77523c;
  text-shadow: 1px 2px 3px rgba(119, 82, 60, 0.12);
}

/* 手机字号 */
@media (max-width: 600px) {
  .art-title {
    font-size: 30px;
    letter-spacing: 2px;
  }
}
  </style>
</head>
<body>

  <footer>© 元子</footer>

<!-- 装饰性雪花，不影响页面操作 -->
<div id="snowfall" aria-hidden="true"></div>

<script>
  const snowLayer = document.getElementById("snowfall");
  const snowCount = window.innerWidth < 600 ? 12 : 24;

  for (let i = 0; i < snowCount; i++) {
    const flake = document.createElement("span");

    flake.className = "falling-snow";
    flake.textContent = "❄";

    // 随机位置、大小和透明度
    flake.style.left = Math.random() * 100 + "%";
    flake.style.fontSize = 10 + Math.random() * 12 + "px";
    flake.style.opacity = 0.2 + Math.random() * 0.35;

    // 每片雪花使用不同速度和横向偏移
    flake.style.animationDuration = 12 + Math.random() * 14 + "s";
    flake.style.animationDelay = -Math.random() * 26 + "s";
    flake.style.setProperty("--drift", Math.random() * 120 - 60 + "px");

    snowLayer.appendChild(flake);
  }
</script>

</body>
</html>
